<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tej Pratap | Profile</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #ffffff; 
            --accent: #f8fafc;
            --text: #1e293b;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text); margin: 0; line-height: 1.6; background-color: #f1f5f9; }
        
        header {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: white;
            padding: 5rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .container { max-width: 900px; margin: -3rem auto 3rem; padding: 0 1.5rem; }

        section {
            margin-bottom: 2rem;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h2 { color: var(--primary); display: flex; align-items: center; gap: 10px; margin-top: 0; }

        /* Map Styling */
        .map-container {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin-top: 15px;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .location-info { margin-bottom: 15px; font-weight: 500; }

        /* Details Styling */
        #filterInput {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        #filterInput:focus { border-color: var(--primary); outline: none; }

        .item-list { list-style: none; padding: 0; }
        .item-list li { 
            background: var(--accent); 
            margin: 8px 0; 
            padding: 12px 18px; 
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid var(--primary);
        }

        @media (max-width: 600px) {
            .item-list li { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>Tej Pratap</h1>
    <p>Professional Teacher | Tech Enthusiast</p>
</header>

<div class="container">
    <section id="my-location">
        <h2>📍 My Location</h2>
        <div class="location-info">
            <strong>Current Residence:</strong> Kumar Khand, Bihar 852112, India
        </div>
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14353.472147137812!2d86.95356555!3d25.923055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39ef364720aa812f%3A0xad72014bc9ee94f2!2sKumar%20Khand%2C%20Bihar%20852112!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </section>

    <section id="details">
        <h2>📄 Personal Details</h2>
        <input type="text" id="filterInput" placeholder="Search skills, email, or info..." onkeyup="filterDetails()">
        <ul class="item-list" id="detailsList">
            </ul>
    </section>
</div>

<script>
    const myDetails = [
        { label: "Full Name", value: "TEJ PRATAP" },
        { label: "Email", value: "sonukumarakela7654@gmail.com" },
        { label: "Main Skill", value: "Teaching" },
        { label: "Interests", value: "Traveling" },
        { label: "Experience", value: "5+ Years in Tech/Education" }
    ];

    function renderDetails(data) {
        const list = document.getElementById('detailsList');
        list.innerHTML = data.map(item => `
            <li>
                <strong>${item.label}</strong>
                <span>${item.value}</span>
            </li>
        `).join('');
    }

    function filterDetails() {
        const query = document.getElementById('filterInput').value.toLowerCase();
        const filtered = myDetails.filter(d => 
            d.label.toLowerCase().includes(query) || 
            d.value.toLowerCase().includes(query)
        );
        renderDetails(filtered);
    }

    renderDetails(myDetails);
</script>

</body>
</html>
